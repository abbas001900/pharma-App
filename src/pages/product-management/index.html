<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des produits | Pharm-Inv</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h3 class="fw-bold m-0">Gestion des produits</h3>
                    <a href="../sign-in/index.html" class="btn btn-outline-pharm rounded-2">
                        <i class="bi bi-arrow-left me-2"></i>Retour au panneau
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Image</th>
                                <th>Nom</th>
                                <th>Catégorie</th>
                                <th>Prix</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><img src="../../assets/img/icons/ads-placeholder.svg" width="55" class="rounded" alt="Produit"></td>
                                <td class="fw-semibold">Paracétamol</td>
                                <td>Antidouleur</td>
                                <td>1500 FCFA</td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                                        <button class="btn btn-light btn-sm text-dark fw-semibold" data-bs-toggle="modal" data-bs-target="#modalModifier">
                                            <i class="bi bi-pencil-square me-1"></i>Modifier
                                        </button>
                                        <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalSupprimer">
                                            <i class="bi bi-trash me-1"></i>Supprimer
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td><img src="../../assets/img/icons/ads-placeholder.svg" width="55" class="rounded" alt="Produit"></td>
                                <td class="fw-semibold">Vitamine C</td>
                                <td>Compléments</td>
                                <td>2500 FCFA</td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                                        <button class="btn btn-light btn-sm text-dark fw-semibold" data-bs-toggle="modal" data-bs-target="#modalModifier">
                                            <i class="bi bi-pencil-square me-1"></i>Modifier
                                        </button>
                                        <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalSupprimer">
                                            <i class="bi bi-trash me-1"></i>Supprimer
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td><img src="../../assets/img/icons/ads-placeholder.svg" width="55" class="rounded" alt="Produit"></td>
                                <td class="fw-semibold">Sirop</td>
                                <td>Médicaments</td>
                                <td>3200 FCFA</td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                                        <button class="btn btn-light btn-sm text-dark fw-semibold" data-bs-toggle="modal" data-bs-target="#modalModifier">
                                            <i class="bi bi-pencil-square me-1"></i>Modifier
                                        </button>
                                        <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalSupprimer">
                                            <i class="bi bi-trash me-1"></i>Supprimer
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalModifier" tabindex="-1" aria-labelledby="modalModifierLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-2 shadow">
                <div class="modal-header">
                    <h4 class="modal-title fw-bold" id="modalModifierLabel">Modifier le produit</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Nom du produit</label>
                            <input type="text" class="form-control" value="Paracétamol">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Catégorie</label>
                            <input type="text" class="form-control" value="Antidouleur">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Prix</label>
                            <input type="text" class="form-control" value="1500 FCFA">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-semibold">Image du produit</label>
                            <input type="file" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" rows="4">Description du produit...</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary rounded-2 px-2" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-pharm text-white fw-semibold rounded-2 px-2">Enregistrer les modifications</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalSupprimer" tabindex="-1" aria-labelledby="modalSupprimerLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-2 shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-danger" id="modalSupprimerLabel">Supprimer le produit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-2">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-3 mb-3 d-block"></i>
                    <p class="mb-2 fw-semibold">Voulez-vous vraiment supprimer ce produit ?</p>
                    <p class="text-muted mb-0">Cette action est irréversible.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary rounded-2 px-2" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-danger rounded-2 px-2">Oui, supprimer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
