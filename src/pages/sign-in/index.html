<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Pharm-Inv</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="bg-white p-0">

    <nav class="bg-pharm py-3 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <h3 class="text-white fw-bold m-0">Panneau Administrateur</h3>
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <p class="text-white m-0 fs-5">
                    Vous êtes connectés en tant que, <strong><em>Nom du Pharmacien</em></strong>
                </p>
                <a href="../../../index.html" class="btn btn-light fw-semibold px-3 py-1 rounded-2">
                    <i class="bi bi-house-door-fill me-2"></i>Cliquez Ici
                </a>
            </div>
        </div>
    </nav>

    <main class="container-lg py-5">
        <h3 class="text-center fw-bold mb-5 fs-4">
            Bienvenue sur le panneau administrateur, choisissez une action pour procéder
        </h3>

        <div class="row justify-content-center g-4 py-5" style="max-width: 800px; margin: 0 auto;">
            <!-- Bloc 1 : Modifier les options -->
            <div class="col-12">
                <div class="position-relative text-center admin-item-wrapper">
                    <a 
                        href="../shop/index.html"
                        class="btn admin-btn-pharm text-white fw-bold fs-4 py-5 w-100 rounded-3"
                        data-bs-toggle="tooltip"
                        data-bs-placement="right"
                        data-bs-title="En choisissant cette option vous pourrez modifier la publicité, les contacts et autres options du site web."
                        >
                        <i class="bi bi-sliders me-3"></i>Modifier les options du site web
                    </a>
                </div>
            </div>

            <!-- Bloc 2 : Modifiez les produits -->
            <div class="col-12">
                <div class="position-relative text-center admin-item-wrapper">
                    <a 
                        href="../product/index.html"
                        class="btn admin-btn-pharm text-white fw-bold fs-4 py-5 w-100 rounded-3"
                        data-bs-toggle="tooltip"
                        data-bs-placement="right"
                        data-bs-title="Ajouter, modifier ou supprimer les produits de la pharmacie."
                        >
                        <i class="bi bi-box-seam me-3"></i>Modifiez les produits
                    </a>
                </div>
            </div>

            <!-- Bloc 3 : Modifiez les blogs -->
            <div class="col-12">
                <div class="position-relative text-center admin-item-wrapper">
                    <a 
                        href="../../../index.html"
                        class="btn admin-btn-pharm text-white fw-bold fs-4 py-5 w-100 rounded-3"
                        data-bs-toggle="tooltip"
                        data-bs-placement="right"
                        data-bs-title="Gérer les articles et publications du blog."
                        >
                        <i class="bi bi-newspaper me-3"></i>Modifiez les blogs
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (element) {
                new bootstrap.Tooltip(element, {
                    placement: 'right'
                });
            });
        });
    </script>
</body>

</html>
